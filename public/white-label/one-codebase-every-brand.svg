<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="One shared codebase reads a single brand folder at build time; the same app becomes the Whitelabel, Persistent Software or AutoCycle AI product, each with its own colours, copy and name.">
  <title>One codebase, every brand</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7788"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#030712"/>

  <text x="40" y="52" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.5" fill="#00b7d7">WHITE-LABEL MOBILE APP</text>
  <text x="40" y="88" font-family="Manrope, Inter, 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="800" fill="#f3f4f6">One codebase. Every brand.</text>

  <rect x="40" y="140" width="260" height="320" rx="12" fill="#0b1220" stroke="#1f2a37"/>
  <text x="62" y="170" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1" fill="#9aa4b2">ONE FOLDER PER BRAND</text>
  
  <g opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.31;0.333;0.975;0.999;1" values="1;1;0;0;1;1"/>
    <rect x="54" y="178" width="232" height="44" rx="8" fill="#12203a" stroke="#00b7d7"/>
  </g>
  <rect x="70" y="192" width="16" height="16" rx="4" fill="#4338ca" stroke="#1f2a37"/>
  <text x="96" y="204" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e5e7eb">brands/default</text>
  <g opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.31;0.333;0.643;0.667;1" values="0;0;1;1;0;0"/>
    <rect x="54" y="240" width="232" height="44" rx="8" fill="#12203a" stroke="#00b7d7"/>
  </g>
  <rect x="70" y="254" width="16" height="16" rx="4" fill="#0092b5" stroke="#1f2a37"/>
  <text x="96" y="266" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e5e7eb">brands/persistentsoftware</text>
  <g opacity="1">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.643;0.667;0.975;0.999;1" values="0;0;1;1;0;0"/>
    <rect x="54" y="302" width="232" height="44" rx="8" fill="#12203a" stroke="#00b7d7"/>
  </g>
  <rect x="70" y="316" width="16" height="16" rx="4" fill="#a385ff" stroke="#1f2a37"/>
  <text x="96" y="328" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e5e7eb">brands/autocycle</text>
  <text x="62" y="410" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#9aa4b2">config · assets · fonts</text>
  <text x="62" y="430" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#9aa4b2">nothing else changes</text>

  <line x1="300" y1="300" x2="378" y2="300" stroke="#6b7788" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="339" y="288" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#9aa4b2">reads one</text>

  <rect x="380" y="200" width="180" height="200" rx="12" fill="#0b1220" stroke="#1f2a37"/>
  <text x="400" y="232" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#f3f4f6">src/</text>
  <text x="400" y="266" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#e5e7eb">13 content blocks</text>
  <text x="400" y="290" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#e5e7eb">6 screen kinds</text>
  <text x="400" y="314" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#e5e7eb">sign-in, push, analytics</text>
  <text x="400" y="338" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#e5e7eb">14 colour tokens</text>
  <text x="400" y="378" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#6b7788">shared by every brand</text>

  <line x1="560" y1="300" x2="688" y2="300" stroke="#6b7788" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="624" y="288" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#9aa4b2">builds</text>

  
  <text x="805" y="108" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8b93f5" opacity="0">BRAND=default
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.31;0.333;0.975;0.999;1" values="1;1;0;0;1;1"/>
  </text>
  <text x="805" y="108" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#0092b5" opacity="0">BRAND=persistentsoftware
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.31;0.333;0.643;0.667;1" values="0;0;1;1;0;0"/>
  </text>
  <text x="805" y="108" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#a385ff" opacity="1">BRAND=autocycle
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.643;0.667;0.975;0.999;1" values="0;0;1;1;0;0"/>
  </text>
  <rect x="700" y="120" width="230" height="390" rx="34" fill="#0b0b10" stroke="#2a2833" stroke-width="2"/>
  
  <g opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.31;0.333;0.975;0.999;1" values="1;1;0;0;1;1"/>
    <rect x="712" y="132" width="206" height="366" rx="26" fill="#ffffff"/>
    <rect x="726" y="158" width="28" height="28" rx="7" fill="#4338ca"/>
    <text x="740" y="177" text-anchor="middle" font-family="Manrope, Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">WL</text>
    <text x="762" y="176" font-family="Manrope, Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Whitelabel</text>
    <text x="726" y="212" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.6" fill="#475569">WHITE-LABEL BASE APP</text>
    <text x="726" y="236" font-family="Manrope, Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="800" fill="#0f172a">One codebase.</text><text x="726" y="260" font-family="Manrope, Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="800" fill="#0f172a">Every brand.</text>
    <text x="726" y="292" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#475569">Everything here came from</text><text x="726" y="308" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#475569">a single config file.</text>
    <rect x="726" y="338" width="178" height="40" rx="10" fill="#4338ca"/>
    <text x="815" y="363" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff">See the blocks</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.31;0.333;0.643;0.667;1" values="0;0;1;1;0;0"/>
    <rect x="712" y="132" width="206" height="366" rx="26" fill="#ffffff"/>
    <rect x="726" y="158" width="28" height="28" rx="7" fill="#0092b5"/>
    <text x="740" y="177" text-anchor="middle" font-family="Manrope, Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#041016">PS</text>
    <text x="762" y="176" font-family="Manrope, Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#101828">Persistent Software</text>
    <text x="726" y="212" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.6" fill="#4a5565">AI-ACCELERATED ENGINEERING</text>
    <text x="726" y="236" font-family="Manrope, Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="800" fill="#101828">Ship real software,</text><text x="726" y="260" font-family="Manrope, Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="800" fill="#101828">faster than ever.</text>
    <text x="726" y="292" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#4a5565">20+ years of engineering,</text><text x="726" y="308" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#4a5565">AI-assisted delivery.</text>
    <rect x="726" y="338" width="178" height="40" rx="10" fill="#0092b5"/>
    <text x="815" y="363" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#041016">Start a project</text>
  </g>
  <g opacity="1">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.643;0.667;0.975;0.999;1" values="0;0;1;1;0;0"/>
    <rect x="712" y="132" width="206" height="366" rx="26" fill="#15141b"/>
    <rect x="726" y="158" width="28" height="28" rx="7" fill="#a385ff"/>
    <text x="740" y="177" text-anchor="middle" font-family="Manrope, Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" fill="#161022">AC</text>
    <text x="762" y="176" font-family="Manrope, Inter, 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#f3f1f6">AutoCycle AI</text>
    <text x="726" y="212" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" letter-spacing="0.6" fill="#aca6b5">AI FOR SUPPORT &amp; PRODUCT TEAMS</text>
    <text x="726" y="236" font-family="Manrope, Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="800" fill="#f3f1f6">Close the loop</text><text x="726" y="260" font-family="Manrope, Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="800" fill="#f3f1f6">between support</text><text x="726" y="284" font-family="Manrope, Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="800" fill="#f3f1f6">and engineering.</text>
    <text x="726" y="316" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#aca6b5">Every ticket linked to the</text><text x="726" y="332" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#aca6b5">right issue, automatically.</text>
    <rect x="726" y="362" width="178" height="40" rx="10" fill="#a385ff"/>
    <text x="815" y="387" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#161022">See how it works</text>
  </g>

  <text x="40" y="524" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#6b7788">Every brand checked against WCAG AA before it builds · no brand is named in src/</text>
</svg>
